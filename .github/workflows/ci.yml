name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle-size budget
        run: npm run size

  bff:
    name: BFF (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: bff/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...

  container:
    name: Container build (smoke)
    runs-on: ubuntu-latest
    needs: [frontend, bff]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f deploy/Containerfile -t lineaweb:ci .
