#
# Local Linea-web (frontend + BFF) pointed at the Azure-hosted
# linea-server. Use this when iterating on the web side without
# rebuilding/pushing images.
#
# Prereqs (one-time):
#   1. Re-deploy infra with serverExternalIngress=true so the
#      Azure linea-server has an external FQDN.
#   2. Add http://localhost:8090/auth/callback to the Linea-web
#      Entra app registration's redirect URIs.
#   3. Create .env.azure (see .env.azure.example) with the values
#      from your Linea-deploy GitHub secrets.
#
# Run:
#   docker compose -f docker-compose.azure.yml --env-file .env.azure up --build
#
# Open: http://localhost:8090

services:
  lineaweb:
    build:
      context: .
      dockerfile: deploy/Containerfile
    environment:
      LINEA_BFF_ADDR: ":8090"
      LINEA_BFF_COOKIE_SECURE: "false"
      LINEA_BFF_SESSION_DIR: "/data/sessions"
      LINEA_BFF_UPSTREAM_URL: "${LINEA_SERVER_URL}"
      LINEA_OIDC_ISSUER: "${LINEA_OIDC_ISSUER}"
      LINEA_OIDC_CLIENT_ID: "${LINEA_WEB_CLIENT_ID}"
      LINEA_OIDC_CLIENT_SECRET: "${LINEA_WEB_CLIENT_SECRET}"
      LINEA_OIDC_REDIRECT_URL: "http://localhost:8090/auth/callback"
      LINEA_BFF_POST_LOGIN_URL: "/"
    ports:
      - "8090:8090"
    volumes:
      - linea-web-azuredev-data:/data

volumes:
  linea-web-azuredev-data:
